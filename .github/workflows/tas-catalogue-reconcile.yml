name: TAS catalogue reconcile

on:
  pull_request:
    paths:
      - "src/lib/tas/intake/**"
      - "scripts/tas-reconcile-legacy-map.mjs"
      - ".github/workflows/tas-catalogue-reconcile.yml"

jobs:
  tas-reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The script imports the TypeScript catalogue directly; Node 22.18+ (here 24) strips types by default.
          node-version: "24"
      - name: Fail if the 113 legacy fields, the question count or the placeholder rule do not reconcile
        run: node scripts/tas-reconcile-legacy-map.mjs
