name: Email redirect URL guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-email-redirect-urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if token-bearing links are built from a request value
        run: node scripts/check-email-redirect-urls.mjs
